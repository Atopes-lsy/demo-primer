[project]
name = "primer-backend"
version = "0.1.0"
description = "Primer —— 千牛客服工作台右栏插件的判定服务"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12",
  "pydantic-settings>=2.8",
  # 一个 OpenAI 兼容 client 打通所有国内厂商：换模型只改 base_url + model。
  "openai>=2.6",
  "openpyxl>=3.1",
  # 这里**故意没有** sqlalchemy／asyncpg／pgvector。
  # 它们从步骤 1 起就挂在这儿，但全项目 0 次 import —— 六源是查表不是检索
  # （① 商品属性表 20 行、② 口径表 20 条、④⑤⑥ 每会话各 1 条），
  # 理由写在 `app/检索/__init__.py` 的文件头。留着会让人以为有个用不上的向量库。
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "httpx>=0.28",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
