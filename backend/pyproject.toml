[project]
name = "primer-backend"
version = "0.1.0"
description = "Primer —— 千牛客服工作台右栏插件的判定服务"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "pydantic>=2.12",
  "pydantic-settings>=2.8",
  "sqlalchemy[asyncio]>=2.0.40",
  "asyncpg>=0.30",
  "pgvector>=0.4",
  # 一个 OpenAI 兼容 client 打通所有国内厂商：换模型只改 base_url + model。
  "openai>=2.6",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "httpx>=0.28",
  "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
